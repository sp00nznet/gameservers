name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deployer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxmox-deployer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
      - name: Docker image builds
        run: docker build -t deployer .

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done
